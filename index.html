<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le Buffet Menu</title>
  
  <!-- PWA Manifest Integration -->
  <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkxlIEJ1ZmZldCBNZW51IiwKICAic2hvcnRfbmFtZSI6ICJMZSBCdWZmZXQiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2ZlZmNmNiIsCiAgInRoZW1lX2NvbG9yIjogIiMwZDFhOGEiCn0=" />
  <meta name="theme-color" content="#0d1a8a">
  <link rel="apple-touch-icon" href="images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fefcf6;
      --primary-color: #0d1a8a;
      --accent-gold: #d4af37;
      --font-logo: 'Great Vibes', cursive;
      --font-main: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #333;
      font-family: var(--font-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      position: relative;
      background: #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      z-index: 1;
      background-size: cover;
      background-position: center;
    }

    .screen.active {
      display: flex;
      z-index: 2;
    }

    .glass-panel {
      background: rgba(20, 20, 20, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      color: #fff;
    }

    #splash-screen {
      background-image: url('673.png');
      cursor: pointer;
    }
    .splash-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px 24px 40px;
    }
    .lang-switcher-splash {
      align-self: flex-end;
      display: flex;
      gap: 12px;
      background: rgba(0,0,0,0.4);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }
    .lang-btn {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-weight: 500;
      border: none;
      background: none;
      cursor: pointer;
    }
    .lang-btn.active {
      color: #fff;
      font-weight: 700;
      font-size: 15px;
    }

    #choice-screen {
      background-image: url('674.png');
      position: relative;
      cursor: pointer;
    }
    .choice-overlay-btn {
      position: absolute;
      left: 8%; width: 84%;
      height: 18%;
      opacity: 0;
      cursor: pointer;
    }
    #btn-kitchen { top: 28%; }
    #btn-bar { top: 52%; }

    #menu-screen {
      background: #0d0d0d;
      color: #fff;
      position: relative;
      overflow-y: auto;
    }
    #menu-screen::before {
      content: '';
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background-image: url('674.png');
      background-size: cover;
      opacity: 0.15;
      filter: blur(10px);
      pointer-events: none;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }
    .cart-icon-btn {
      position: relative;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
    }
    .cart-badge {
      position: absolute;
      top: -4px; right: -4px;
      background: #e74c3c;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .search-box {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }
    .cat-chip {
      padding: 8px 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      color: rgba(255,255,255,0.7);
    }
    .cat-chip.active {
      background: var(--accent-gold);
      color: #000;
      font-weight: 600;
    }

    .menu-items-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 80px;
    }

    .food-card {
      display: flex;
      gap: 12px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .food-card:active { transform: scale(0.98); }
    .food-img {
      width: 80px; height: 80px;
      border-radius: 12px;
      object-fit: cover;
    }
    .food-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .food-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .food-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .food-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .food-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
    }
    .food-time {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }

    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      justify-content: flex-end;
      flex-direction: column;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #181818;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      color: #fff;
      border-top: 1px solid rgba(255,255,255,0.15);
    }
    .modal-img {
      width: 100%;
      height: 220px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 16px;
    }
    .add-cart-btn {
      width: 100%;
      background: var(--accent-gold);
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 16px;
      cursor: pointer;
    }

    .service-footer {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(13, 13, 13, 0.9);
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: var(--accent-gold);
      border-top: 1px solid rgba(255,255,255,0.05);
      z-index: 5;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div id="splash-screen" class="screen active">
    <div class="splash-content">
      <div class="lang-switcher-splash" id="splash-lang-box">
        <button class="lang-btn active" data-lang="az">AZ</button>
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <div id="choice-screen" class="screen">
    <div class="choice-overlay-btn" id="btn-kitchen"></div>
    <div class="choice-overlay-btn" id="btn-bar"></div>
  </div>

  <div id="menu-screen" class="screen">
    <div class="header">
      <div class="nav-bar">
        <button class="back-btn" id="btn-back">← Back</button>
        <div class="lang-switcher-splash" id="menu-lang-box">
          <button class="lang-btn" data-lang="az">AZ</button>
          <button class="lang-btn" data-lang="ru">RU</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <button class="cart-icon-btn" id="btn-cart-toggle">
          🛒 <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
      <input type="text" class="search-box" id="search-input" placeholder="Menyuda axtar...">
    </div>

    <div class="categories-scroll" id="categories-container"></div>
    <div class="menu-items-list" id="menu-container"></div>
    <div class="service-footer">SERVİS HAQQI 10%</div>
  </div>
</div>

<div class="modal" id="dish-modal">
  <div class="modal-content glass-panel" id="modal-body"></div>
</div>

<div class="modal" id="cart-modal">
  <div class="modal-content glass-panel">
    <h2 style="margin-bottom: 16px;">Səbət</h2>
    <div id="cart-items"></div>
    <hr style="margin: 16px 0; border-color: rgba(255,255,255,0.1);">
    <div style="display:flex; justify-content:space-between; margin-bottom: 8px;">
      <span>Məbləğ:</span>
      <span id="cart-subtotal">0.00 ₼</span>
    </div>
    <div style="display:flex; justify-content:space-between; color: var(--accent-gold); margin-bottom: 16px;">
      <span>Servis haqqı (10%):</span>
      <span id="cart-service">0.00 ₼</span>
    </div>
    <div style="display:flex; justify-content:space-between; font-weight:bold; font-size: 18px; margin-bottom: 16px;">
      <span>Cəmi:</span>
      <span id="cart-total">0.00 ₼</span>
    </div>
    <button class="add-cart-btn" id="btn-confirm-order">Sifarişi təsdiqlə</button>
    <button class="back-btn" style="width:100%; margin-top: 8px;" id="btn-close-cart">Bağla</button>
  </div>
</div>

<script>
  let currentLang = 'az';
  let currentType = 'kitchen';
  let currentCategory = 'all';
  const cart = [];

  const menu = [
    {
      id: 1, type: "kitchen", category: "salads",
      name: { az: "Klassik Sezar salatı", ru: "Классический салат Цезарь", en: "Classic Caesar Salad" },
      ingredients: { az: "Toyuq filesi, romaine salatı, karaviz, parmesan pendiri...", ru: "Куриное филе, салат ромэн, сельдерей, пармезан...", en: "Chicken fillet, romaine, celery, parmesan..." },
      price: 14.90, time: 15, image: "675.png", tags: ["popular", "chef"]
    },
    {
      id: 2, type: "kitchen", category: "salads",
      name: { az: "Karidesli salat", ru: "Салат с креветками", en: "Shrimp Salad" },
      ingredients: { az: "Karides, karaviz, avokado, xüsusi sous", ru: "Креветки, сельдерей, авокадо, фирменный соус", en: "Shrimp, celery, avocado, special sauce" },
      price: 18.50, time: 12, image: "683.png", tags: ["chef"]
    },
    {
      id: 3, type: "kitchen", category: "soups",
      name: { az: "Karəviz şorbası", ru: "Суп из сельдерея", en: "Celery Soup" },
      ingredients: { az: "Tərəvəz, karəviz, krema", ru: "Овощи, сельдерей, сливки", en: "Vegetables, celery, cream" },
      price: 7.50, time: 20, image: "683.png", tags: ["popular"]
    },
    {
      id: 4, type: "bar", category: "cocktails",
      name: { az: "Aperol Spritz", ru: "Апероль Спритц", en: "Aperol Spritz" },
      ingredients: { az: "Aperol, prosecco, portağal", ru: "Апероль, просекко, апельсин", en: "Aperol, prosecco, orange" },
      price: 14.90, time: 5, image: "677.png", tags: ["popular"]
    },
    {
      id: 5, type: "bar", category: "cocktails",
      name: { az: "Mojito", ru: "Мохито", en: "Mojito" },
      ingredients: { az: "Rom, ahəng, nanə", ru: "Ром, лайм, мята", en: "Rum, lime, mint" },
      price: 12.90, time: 5, image: "676.png", tags: []
    }
  ];

  const categoriesMap = {
    kitchen: [
      { id: "all", name: { az: "Hamısı", ru: "Все", en: "All" } },
      { id: "salads", name: { az: "Salatlar", ru: "Салаты", en: "Salads" } },
      { id: "soups", name: { az: "Şorbalar", ru: "Супы", en: "Soups" } }
    ],
    bar: [
      { id: "all", name: { az: "Hamısı", ru: "Все", en: "All" } },
      { id: "cocktails", name: { az: "Kokteyllər", ru: "Коктейли", en: "Cocktails" } }
    ]
  };

  function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => {
      const btnLang = b.getAttribute('data-lang');
      b.classList.toggle('active', btnLang === lang);
    });
    renderCategories();
    renderMenu();
  }

  function goToChoice() {
    document.getElementById('splash-screen').classList.remove('active');
    document.getElementById('choice-screen').classList.add('active');
  }

  function goBack() {
    document.getElementById('menu-screen').classList.remove('active');
    document.getElementById('choice-screen').classList.add('active');
  }

  function openMenu(type) {
    currentType = type;
    currentCategory = 'all';
    document.getElementById('choice-screen').classList.remove('active');
    document.getElementById('menu-screen').classList.add('active');
    renderCategories();
    renderMenu();
  }

  function renderCategories() {
    const container = document.getElementById('categories-container');
    if (!container) return;
    container.innerHTML = '';
    categoriesMap[currentType].forEach(cat => {
      const chip = document.createElement('div');
      chip.className = `cat-chip ${currentCategory === cat.id ? 'active' : ''}`;
      chip.innerText = cat.name[currentLang];
      chip.addEventListener('click', () => {
        currentCategory = cat.id;
        renderCategories();
        renderMenu();
      });
      container.appendChild(chip);
    });
  }

  function renderMenu() {
    const container = document.getElementById('menu-container');
    const searchBox = document.getElementById('search-input');
    if (!container || !searchBox) return;
    const searchVal = searchBox.value.toLowerCase();
    container.innerHTML = '';

    const filtered = menu.filter(item => {
      const matchesType = item.type === currentType;
      const matchesCat = currentCategory === 'all' || item.category === currentCategory;
      const matchesSearch = item.name[currentLang].toLowerCase().includes(searchVal);
      return matchesType && matchesCat && matchesSearch;
    });

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'food-card glass-panel';
      card.addEventListener('click', () => openDishModal(item.id));
      card.innerHTML = `
        <img src="${item.image}" class="food-img" alt="${item.name[currentLang]}">
        <div class="food-info">
          <div class="food-title">${item.name[currentLang]}</div>
          <div class="food-desc">${item.ingredients[currentLang]}</div>
          <div class="food-bottom">
            <span class="food-price">${item.price.toFixed(2)} ₼</span>
            <span class="food-time">◷ ${item.time} min</span>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function openDishModal(id) {
    const item = menu.find(m => m.id === id);
    if (!item) return;
    const modal = document.getElementById('dish-modal');
    const body = document.getElementById('modal-body');
    if (!modal || !body) return;

    body.innerHTML = `
      <img src="${item.image}" class="modal-img" alt="${item.name[currentLang]}">
      <h2 style="font-size: 24px;">${item.name[currentLang]}</h2>
      <p style="color: rgba(255,255,255,0.7); margin: 8px 0;">${item.ingredients[currentLang]}</p>
      <div style="font-size: 22px; font-weight: bold; color: var(--accent-gold); margin: 12px 0;">
        ${item.price.toFixed(2)} ₼
      </div>
      <button class="add-cart-btn" id="btn-modal-add">Səbətə əlavə et</button>
      <button class="back-btn" style="width:100%; margin-top: 8px;" id="btn-modal-close">Bağla</button>
    `;

    document.getElementById('btn-modal-add').addEventListener('click', () => addToCart(item.id));
    document.getElementById('btn-modal-close').addEventListener('click', closeDishModal);

    modal.classList.add('active');
  }

  function closeDishModal() {
    const modal = document.getElementById('dish-modal');
    if (modal) modal.classList.remove('active');
  }

  function addToCart(id) {
    const item = menu.find(m => m.id === id);
    if (item) {
      cart.push(item);
      const cartCount = document.getElementById('cart-count');
      if (cartCount) cartCount.innerText = cart.length.toString();
    }
    closeDishModal();
  }

  function toggleCart() {
    const modal = document.getElementById('cart-modal');
    if (!modal) return;
    modal.classList.toggle('active');
    if (modal.classList.contains('active')) renderCart();
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    if (!container) return;
    container.innerHTML = '';
    let subtotal = 0;

    cart.forEach(item => {
      subtotal += item.price;
      const row = document.createElement('div');
      row.style.cssText = "display:flex; justify-content:space-between; margin-bottom: 8px;";
      row.innerHTML = `<span>${item.name[currentLang]}</span><span>${item.price.toFixed(2)} ₼</span>`;
      container.appendChild(row);
    });

    const service = subtotal * 0.10;
    const total = subtotal + service;

    document.getElementById('cart-subtotal').innerText = subtotal.toFixed(2) + " ₼";
    document.getElementById('cart-service').innerText = service.toFixed(2) + " ₼";
    document.getElementById('cart-total').innerText = total.toFixed(2) + " ₼";
  }

  // EVENT LISTENERS BINDING
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('splash-screen').addEventListener('click', goToChoice);
    
    document.querySelectorAll('.lang-switcher-splash').forEach(box => {
      box.addEventListener('click', (ev) => ev.stopPropagation());
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const lang = btn.getAttribute('data-lang');
        if (lang) setLang(lang);
      });
    });

    document.getElementById('btn-kitchen').addEventListener('click', () => openMenu('kitchen'));
    document.getElementById('btn-bar').addEventListener('click', () => openMenu('bar'));
    document.getElementById('btn-back').addEventListener('click', goBack);
    document.getElementById('btn-cart-toggle').addEventListener('click', toggleCart);
    document.getElementById('btn-close-cart').addEventListener('click', toggleCart);
    document.getElementById('btn-confirm-order').addEventListener('click', () => alert('Sifarişiniz qəbul olundu!'));
    document.getElementById('search-input').addEventListener('input', renderMenu);

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('v1').then(c => c.addAll(['./']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }
  });
</script>
</body>
</html>
