<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Le Buffet — Bistro · Wine · Coffee</title>

<style>
:root{
    --cream:#f5ead7;
    --cream2:#fff8ec;
    --brown:#3b2418;
    --brown2:#5c3927;
    --gold:#c99b50;
    --gold2:#e6c47d;
    --dark:#18100c;
    --glass:rgba(45,25,16,.72);
    --border:rgba(255,220,160,.25);
    --shadow:0 15px 50px rgba(0,0,0,.25);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#17100c;
    color:var(--cream);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    font:inherit;
}

#app{
    width:100%;
    min-height:100dvh;
}

.screen{
    width:100%;
    min-height:100dvh;
}

/* =========================================================
   COVER
========================================================= */

.cover{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:600px;
    overflow:hidden;
    background:#120b08;
}

.cover-photo{
    position:absolute;
    inset:0;
    background-image:url("cover.jpg");
    background-position:center center;
    background-size:cover;
    background-repeat:no-repeat;
}

.cover-photo::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05) 0%,
            rgba(0,0,0,.04) 48%,
            rgba(0,0,0,.18) 68%,
            rgba(0,0,0,.35) 100%
        );
}

/*
   Real HTML controls are placed over the language selector
   drawn inside the photograph.
*/

.cover-controls{
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
}

/* Language selector */

.language-switcher{
    position:absolute;

    /*
       If your original photo has the selector slightly higher/lower,
       only change this value.
    */
    top:69.8%;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;

    padding:5px;

    min-width:160px;
    height:47px;

    border-radius:100px;

    background:rgba(35,18,10,.78);
    border:1px solid rgba(255,225,165,.38);

    box-shadow:
        0 8px 28px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    pointer-events:auto;
}

.cover-language{
    width:46px;
    height:35px;

    border:0;
    border-radius:100px;

    background:transparent;

    color:#ead9bd;

    font-size:11px;
    font-weight:800;
    letter-spacing:1px;

    cursor:pointer;

    transition:
        background .22s ease,
        color .22s ease,
        transform .12s ease,
        box-shadow .22s ease;
}

.cover-language.active{
    background:linear-gradient(
        135deg,
        #f4d889,
        #b8792e
    );

    color:#29160c;

    box-shadow:
        0 4px 16px rgba(220,176,83,.42),
        inset 0 1px 0 rgba(255,255,255,.45);
}

.cover-language:active{
    transform:scale(.91);
}

/* Continue button */

.cover-continue{
    position:absolute;

    left:14%;
    right:14%;
    bottom:7.2%;

    height:70px;

    border:1px solid rgba(255,230,180,.18);
    border-radius:100px;

    background:rgba(35,18,10,.22);

    color:#fff5df;

    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:1.8px;

    text-shadow:0 2px 5px rgba(0,0,0,.7);

    cursor:pointer;

    pointer-events:auto;

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    transition:.25s ease;
}

.cover-continue:active{
    transform:scale(.97);
    background:rgba(35,18,10,.4);
}

/* =========================================================
   CHOICE
========================================================= */

.choice{
    position:relative;
    min-height:100dvh;
    padding:25px 18px 35px;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(201,155,80,.14),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #24150e,
            #100a07
        );
}

.choice-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    max-width:700px;
    margin:0 auto 35px;
}

.brand-mini{
    font-family:Georgia,"Times New Roman",serif;
    color:var(--gold2);
    font-size:25px;
    letter-spacing:1px;
}

.back-btn{
    border:1px solid var(--border);
    background:rgba(255,255,255,.06);
    color:var(--cream);
    border-radius:50px;
    padding:10px 16px;
    cursor:pointer;
}

.choice-title{
    max-width:700px;
    margin:0 auto 30px;
    text-align:center;
}

.choice-title h1{
    margin:0 0 10px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:35px;
    font-weight:500;

    color:#f8e6c3;
}

.choice-title p{
    margin:0;
    color:#cdbb9e;
    font-size:14px;
}

.choice-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:18px;

    max-width:700px;
    margin:auto;
}

.choice-card{
    position:relative;
    min-height:230px;

    padding:28px;

    border:1px solid var(--border);
    border-radius:28px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.035)
        );

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:.25s ease;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

.choice-card:active{
    transform:scale(.98);
}

.choice-card::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(230,196,125,.2),
            transparent 35%
        );

    pointer-events:none;
}

.choice-icon{
    font-size:43px;
    margin-bottom:20px;
}

.choice-card h2{
    position:relative;
    z-index:1;

    margin:0 0 9px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:27px;
    font-weight:500;

    color:#f6dfb4;
}

.choice-card p{
    position:relative;
    z-index:1;

    margin:0;

    color:#cdbda6;
    font-size:14px;
    line-height:1.5;
}

/* =========================================================
   MENU
========================================================= */

.menu-screen{
    min-height:100dvh;
    background:
        radial-gradient(
            circle at 80% 0%,
            rgba(201,155,80,.13),
            transparent 30%
        ),
        var(--cream);

    color:var(--brown);

    padding-bottom:50px;
}

.menu-top{
    position:sticky;
    top:0;
    z-index:30;

    padding:15px 16px 13px;

    background:rgba(245,234,215,.9);

    border-bottom:1px solid rgba(60,35,20,.12);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.menu-top-inner{
    max-width:900px;
    margin:auto;
}

.menu-top-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.menu-back{
    width:43px;
    height:43px;

    flex:none;

    border:1px solid rgba(60,35,20,.18);
    border-radius:50%;

    background:rgba(255,255,255,.45);

    color:var(--brown);

    cursor:pointer;
}

.menu-brand{
    flex:1;

    font-family:Georgia,"Times New Roman",serif;
    font-size:24px;
    color:var(--brown);
}

.menu-type{
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    color:#947143;
}

.search{
    width:100%;
    margin-top:12px;

    height:45px;

    border:1px solid rgba(60,35,20,.14);
    border-radius:50px;

    padding:0 18px;

    outline:none;

    background:rgba(255,255,255,.6);

    color:var(--brown);

    font-size:14px;
}

.search::placeholder{
    color:#967e67;
}

.categories{
    display:flex;
    gap:8px;

    overflow-x:auto;

    padding:13px 16px 5px;

    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:none;

    border:1px solid rgba(60,35,20,.17);

    border-radius:100px;

    padding:9px 14px;

    background:rgba(255,255,255,.42);

    color:#684a36;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:.2s ease;
}

.category.active{
    background:var(--brown);
    color:#f8e8cf;
    border-color:var(--brown);
}

.menu-content{
    max-width:900px;
    margin:auto;

    padding:18px 16px 30px;
}

.section-title{
    margin:5px 0 15px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:28px;
    font-weight:500;

    color:var(--brown);
}

.dishes{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
}

.dish{
    display:grid;
    grid-template-columns:105px 1fr;

    min-height:120px;

    border-radius:22px;

    overflow:hidden;

    background:rgba(255,255,255,.68);

    border:1px solid rgba(70,40,20,.1);

    box-shadow:
        0 8px 25px rgba(60,35,20,.08);

    cursor:pointer;

    transition:.22s ease;
}

.dish:active{
    transform:scale(.985);
}

.dish-image{
    width:105px;
    height:100%;

    min-height:120px;

    background-size:cover;
    background-position:center;
}

.dish-info{
    padding:14px 13px;
}

.dish-name{
    margin:0 0 6px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:18px;
    line-height:1.15;

    color:var(--brown);
}

.dish-desc{
    margin:0 0 9px;

    color:#765d48;

    font-size:12px;
    line-height:1.4;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.dish-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.price{
    font-weight:800;
    color:#9b6925;
}

.tags{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
}

.tag{
    padding:4px 7px;

    border-radius:50px;

    background:#eee0c8;

    color:#745337;

    font-size:9px;
    font-weight:700;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;

    display:none;
    align-items:flex-end;

    background:rgba(12,7,4,.65);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:100%;
    max-height:92dvh;

    overflow-y:auto;

    border-radius:30px 30px 0 0;

    background:#fff8ec;

    color:var(--brown);

    animation:modalUp .25s ease;
}

@keyframes modalUp{
    from{
        transform:translateY(30px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.modal-image{
    width:100%;
    height:260px;

    background-size:cover;
    background-position:center;

    position:relative;
}

.modal-close{
    position:absolute;
    top:15px;
    right:15px;

    width:42px;
    height:42px;

    border:1px solid rgba(255,255,255,.45);
    border-radius:50%;

    background:rgba(20,10,5,.55);

    color:#fff;

    font-size:20px;

    cursor:pointer;

    backdrop-filter:blur(10px);
}

.modal-body{
    padding:23px 20px 30px;
}

.modal-title{
    margin:0 0 10px;

    font-family:Georgia,"Times New Roman",serif;
    font-size:29px;
    font-weight:500;
}

.modal-price{
    font-size:21px;
    font-weight:800;
    color:#a06e28;

    margin-bottom:18px;
}

.modal-description{
    font-size:14px;
    line-height:1.6;
    color:#705743;
}

.modal-meta{
    margin-top:20px;

    padding:14px;

    border-radius:16px;

    background:#f0e1c8;

    font-size:12px;
    line-height:1.6;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;
    padding:50px 20px;

    color:#806b57;
}

.empty-icon{
    font-size:38px;
    margin-bottom:10px;
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

    .choice-grid{
        grid-template-columns:1fr 1fr;
    }

    .dishes{
        grid-template-columns:1fr 1fr;
    }

    .dish{
        grid-template-columns:120px 1fr;
    }

    .dish-image{
        width:120px;
    }

    .modal{
        align-items:center;
        justify-content:center;
    }

    .modal-card{
        width:min(600px,94vw);
        border-radius:30px;
        max-height:90vh;
    }
}
</style>

/* =========================================================
   CATEGORIES
========================================================= */

const KITCHEN_CATEGORIES = [
    "salads",
    "soups",
    "breakfasts",
    "appetizers",
    "crepes",
    "mains",
    "pizzas",
    "sandwiches"
];

const BAR_CATEGORIES = [
    "juices",
    "cocktails",
    "wines",
    "teaCoffee"
];


/* =========================================================
   LANGUAGE
========================================================= */

function changeLanguage(lang){

    if(!TEXT[lang]){
        return;
    }

    language = lang;

    localStorage.setItem(
        "leBuffetLanguage",
        language
    );

    /*
       Immediately rebuilds the screen.
       Therefore:
       1. active language button changes;
       2. text changes;
       3. current menu remains open if already inside.
    */

    render();

}


/* =========================================================
   NAVIGATION
========================================================= */

function goToChoice(){

    screen = "choice";

    render();

}


function goBackCover(){

    screen = "cover";

    render();

}


function openMenu(type){

    currentType = type;
    currentCategory = "all";
    searchQuery = "";

    screen = "menu";

    render();

}


function setCategory(category){

    currentCategory = category;

    render();

}


function setSearch(value){

    searchQuery = value.toLowerCase().trim();

    render();

}


/* =========================================================
   COVER SCREEN
========================================================= */

function coverScreen(){

    return `

        <main class="screen cover">

            <div class="cover-photo"></div>

            <div class="cover-controls">

                <div class="language-switcher">

                    <button
                        class="cover-language ${language === "az" ? "active" : ""}"
                        onclick="changeLanguage('az')"
                        aria-label="Azərbaycan dili">
                        AZ
                    </button>

                    <button
                        class="cover-language ${language === "ru" ? "active" : ""}"
                        onclick="changeLanguage('ru')"
                        aria-label="Русский язык">
                        RU
                    </button>

                    <button
                        class="cover-language ${language === "en" ? "active" : ""}"
                        onclick="changeLanguage('en')"
                        aria-label="English">
                        EN
                    </button>

                </div>


                <button
                    class="cover-continue"
                    onclick="goToChoice()">

                    ${escapeHTML(t().continue)}

                </button>

            </div>

        </main>

    `;

}


/* =========================================================
   CHOICE SCREEN
========================================================= */

function choiceScreen(){

    return `

        <main class="screen choice">

            <div class="choice-header">

                <div class="brand-mini">
                    Le Buffet
                </div>

                <button
                    class="back-btn"
                    onclick="goBackCover()">

                    ${escapeHTML(t().back)}

                </button>

            </div>


            <div class="choice-title">

                <h1>
                    ${escapeHTML(t().choiceTitle)}
                </h1>

                <p>
                    ${escapeHTML(t().choiceSubtitle)}
                </p>

            </div>


            <div class="choice-grid">

                <article
                    class="choice-card"
                    onclick="openMenu('kitchen')">

                    <div class="choice-icon">
                        🍽️
                    </div>

                    <h2>
                        ${escapeHTML(t().kitchen)}
                    </h2>

                    <p>
                        ${escapeHTML(t().kitchenSub)}
                    </p>

                </article>


                <article
                    class="choice-card"
                    onclick="openMenu('bar')">

                    <div class="choice-icon">
                        🍷
                    </div>

                    <h2>
                        ${escapeHTML(t().bar)}
                    </h2>

                    <p>
                        ${escapeHTML(t().barSub)}
                    </p>

                </article>

            </div>

        </main>

    `;

}


/* =========================================================
   TAG TRANSLATION
========================================================= */

function translateTag(tag){

    if(tag === "chef"){
        return t().chef;
    }

    if(tag === "vegetarian"){
        return t().vegetarian;
    }

    if(tag === "popular"){
        return t().popular;
    }

    return tag;

}


/* =========================================================
   MENU SCREEN
========================================================= */

function menuScreen(){

    const categories =
        currentType === "kitchen"
            ? KITCHEN_CATEGORIES
            : BAR_CATEGORIES;


    let dishes = MENU.filter(
        item => item.type === currentType
    );


    if(currentCategory !== "all"){

        dishes = dishes.filter(
            item => item.category === currentCategory
        );

    }


    if(searchQuery){

        dishes = dishes.filter(item => {

            const name =
                item.name[language] || "";

            const desc =
                item.desc[language] || "";

            const ingredients =
                item.ingredients[language] || "";

            const combined = (
                name +
                " " +
                desc +
                " " +
                ingredients
            ).toLowerCase();

            return combined.includes(searchQuery);

        });

    }


    return `

        <main class="screen menu-screen">

            <header class="menu-top">

                <div class="menu-top-inner">

                    <div class="menu-top-row">

                        <button
                            class="menu-back"
                            onclick="goToChoice()">

                            ←

                        </button>


                        <div class="menu-brand">
                            Le Buffet
                        </div>


                        <div class="menu-type">

                            ${
                                currentType === "kitchen"
                                    ? escapeHTML(t().kitchenTitle)
                                    : escapeHTML(t().barTitle)
                            }

                        </div>

                    </div>


                    <input
                        class="search"
                        type="search"
                        value="${escapeHTML(searchQuery)}"
                        placeholder="${escapeHTML(t().search)}"
                        oninput="setSearch(this.value)"
                        autocomplete="off">

                </div>

            </header>


            <div class="categories">

                <button
                    class="category ${currentCategory === "all" ? "active" : ""}"
                    onclick="setCategory('all')">

                    ${escapeHTML(t().all)}

                </button>


                ${categories.map(category => `

                    <button
                        class="category ${currentCategory === category ? "active" : ""}"
                        onclick="setCategory('${category}')">

                        ${escapeHTML(t()[category])}

                    </button>

                `).join("")}

            </div>


            <section class="menu-content">

                <h1 class="section-title">

                    ${
                        currentType === "kitchen"
                            ? escapeHTML(t().kitchenTitle)
                            : escapeHTML(t().barTitle)
                    }

                </h1>


                ${
                    dishes.length
                    ? `
                        <div class="dishes">

                            ${dishes.map((dish,index) =>
                                dishHTML(dish,index)
                            ).join("")}

                        </div>
                    `
                    : `
                        <div class="empty">

                            <div class="empty-icon">
                                🔎
                            </div>

                            ${escapeHTML(t().noResults)}

                        </div>
                    `
                }

            </section>

        </main>

    `;

}


/* =========================================================
   DISH HTML
========================================================= */

function dishHTML(dish,index){

    const name =
        dish.name[language] || dish.name.en;

    const desc =
        dish.desc[language] || dish.desc.en;


    return `

        <article
            class="dish"
            onclick="openDish(${MENU.indexOf(dish)})">

            <div
                class="dish-image"
                style="background-image:url('${dish.image}')">
            </div>


            <div class="dish-info">

                <h2 class="dish-name">
                    ${escapeHTML(name)}
                </h2>


                <p class="dish-desc">
                    ${escapeHTML(desc)}
                </p>


                <div class="dish-bottom">

                    <div class="price">
                        ${dish.price} ₼
                    </div>


                    <div class="tags">

                        ${
                            dish.tags.slice(0,2).map(tag => `

                                <span class="tag">
                                    ${escapeHTML(translateTag(tag))}
                                </span>

                            `).join("")
                        }

                    </div>

                </div>

            </div>

        </article>

    `;

}


/* =========================================================
   DISH MODAL
========================================================= */

function openDish(index){

    const dish = MENU[index];

    if(!dish){
        return;
    }

    const name =
        dish.name[language] || dish.name.en;

    const ingredients =
        dish.ingredients[language] ||
        dish.ingredients.en;


    const modal = document.createElement("div");

    modal.className = "modal show";

    modal.id = "dishModal";


    modal.innerHTML = `

        <div class="modal-card">

            <div
                class="modal-image"
                style="background-image:url('${dish.image}')">

                <button
                    class="modal-close"
                    onclick="closeDish()">

                    ×

                </button>

            </div>


            <div class="modal-body">

                <h2 class="modal-title">
                    ${escapeHTML(name)}
                </h2>


                <div class="modal-price">
                    ${dish.price} ₼
                </div>


                <div class="modal-description">

                    <strong>
                        ${escapeHTML(t().ingredients)}
                    </strong>

                    <br>

                    ${escapeHTML(ingredients)}

                </div>


                <div class="modal-meta">

                    <strong>
                        ${escapeHTML(t().prep)}:
                    </strong>

                    ${dish.prep} ${escapeHTML(t().minutes)}

                    <br>

                    <strong>
                        ${escapeHTML(t().service)}:
                    </strong>

                    10%

                </div>

            </div>

        </div>

    `;


    modal.addEventListener("click",function(event){

        if(event.target === modal){
            closeDish();
        }

    });


    document.body.appendChild(modal);

}


function closeDish(){

    const modal =
        document.getElementById("dishModal");

    if(modal){
        modal.remove();
    }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const app =
        document.getElementById("app");


    if(screen === "cover"){

        app.innerHTML =
            coverScreen();

        document.documentElement.lang =
            language;

        return;

    }


    if(screen === "choice"){

        app.innerHTML =
            choiceScreen();

        document.documentElement.lang =
            language;

        return;

    }


    if(screen === "menu"){

        app.innerHTML =
            menuScreen();

        document.documentElement.lang =
            language;

        return;

    }

}


/* =========================================================
   START
========================================================= */

render();

</script>
